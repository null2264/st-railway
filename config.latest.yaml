# REF: https://github.com/SillyTavern/SillyTavern/blob/13099c43a93afc23a7fb7544e53024e188fbe537/default/config.yaml

whitelistImportDomains:
  - localhost
  - cdn.discordapp.com
  - files.catbox.moe
  - raw.githubusercontent.com
  - char-archive.evulid.cc

# Expose ST so Railway can forward it to a domain
listen: true
port: ${PORT}
# IPv6 support for those who need it
protocol:
    ipv4: true
    ipv6: ${SILLYTAVERN_ENABLE_IPV6}
dnsPreferIPv6: ${SILLYTAVERN_PREFER_IPV6}

# We'll be using multi-user instead
whitelistMode: false
# Enable multi-user
enableUserAccounts: true
# Whether to hide user list or not
enableDiscreetLogin: ${SILLYTAVERN_DISCREET_LOGIN}
# For some reason ST wouldn't let me expose ST if this is set to false
securityOverride: true

logging:
  enableAccessLog: true
  # Minimum log level to display (DEBUG = 0, INFO = 1, WARN = 2, ERROR = 3)
  minLogLevel: ${SILLYTAVERN_LOG_LEVEL}

gemini:
  apiVersion: '${SILLYTAVERN_GEMINI_API_VERSION}'
  thoughtSignatures: true
  # Enables caching of the system prompt (if supported). Only for OpenRouter.
  # -- IMPORTANT! --
  # Use only when the prompt before the chat history is static and doesn't change between requests
  # (e.g {{random}} macro or lorebooks not as in-chat injections).
  # Otherwise, you'll just waste money on cache misses.
  enableSystemPromptCache: false

browserLaunch:
  # We're running this headless, so no need for this
  enabled: false

##region v1.13.4
# TODO: Probably useful?
hostWhitelist:
  # Enable or disable host whitelisting
  enabled: false
  # Scan incoming requests for potential host header spoofing
  scan: true
  # List of allowed hosts. Do not include localhost or IPs, these are safe.
  # Use a dot to create subdomain patterns.
  # Examples:
  # - example.com
  # - .trycloudflare.com
  hosts: []
##endregion

##region v1.13.5
# TODO: Probably not possible in Railway?
# -- SSO LOGIN CONFIGURATION --
sso:
  # Enable's authlia based auto login. Only enable this if you
  # have setup and installed Authelia as a middle-ware on your
  # reverse proxy
  # https://www.authelia.com/
  # This will use auto login to an account with the same username
  # as that used for authlia. (Ensure the username in authlia
  # is an exact match in lowercase with that in sillytavern)
  autheliaAuth: false
  # Enable's authentik based auto login. Only enable this if you
  # have setup and installed Authentik as a middle-ware on your
  # reverse proxy.
  # https://goauthentik.io/
  # This will use auto login to an account with the same username
  # as that used for authentik. (Ensure the username in authentik
  # is an exact match in lowercase with that in sillytavern).
  authentikAuth: false
##endregion

##region v1.16.0
heartbeatInterval: 0

# NOTE: Probably useless?
cors:
  # Enable or disable CORS middleware
  enabled: true
  # Allowed origins. Use "null" to match the default browser file origin.
  # You can set "*" to allow any origin, or a list of allowed origins.
  origin:
    - "null"
  # Allowed methods
  methods:
    - "OPTIONS"
  # Allowed request headers (optional)
  allowedHeaders: []
  # Exposed response headers (optional)
  exposedHeaders: []
  # Allow credentials (cookies, authorization headers)
  credentials: false
  # Preflight cache max age in seconds (optional)
  maxAge: null
##endregion

# PERFORMANCE-RELATED CONFIGURATION
performance:
  # Enables lazy loading of character cards. Improves performances with large card libraries.
  # May have compatibility issues with some extensions.
  lazyLoadCharacters: false
  # The maximum amount of memory that parsed character cards can use. Set to 0 to disable memory caching.
  memoryCacheCapacity: '100mb'
  # Enables disk caching for character cards. Improves performances with large card libraries.
  useDiskCache: true
  # Configures gzip compression for client requests with large payloads (e.g. settings or chat saves).
  requestCompression:
    # Enable request compression.
    enabled: ${SILLYTAVERN_REQUEST_COMPRESSION}
    # Minimum payload size to trigger compression. Set to 0 to compress all requests regardless of size.
    minPayloadSize: '256kb'
    # Hard upper payload size limit for compression. Set to 0 to allow compression of any size.
    maxPayloadSize: '8mb'
    # Timeout for request compression in milliseconds.
    timeout: 4000
